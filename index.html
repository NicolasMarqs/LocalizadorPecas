<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Localizador de Peças | Online</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 25px 12px 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitulo {
            text-align: center;
            color: #555;
            margin-bottom: 35px;
        }

        #codigo {
            width: 100%;
            height: 55px;
            padding: 0 16px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            background: white;
        }

        #codigo:focus {
            border-color: #222;
        }

        .btn-buscar {
            width: 100%;
            height: 53px;
            margin-top: 12px;
            border: 0;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #resultado {
            margin-top: 42px;
        }

        .resultado-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 12px;
        }

        .resultado-card p {
            margin: 8px 0;
            line-height: 1.4;
        }

        .nao-encontrada {
            background: white;
            color: #e00022;
            text-align: center;
            padding: 18px;
            border-radius: 10px;
            font-size: 17px;
        }

        #areaAdmin {
            margin-top: 40px;
        }

        .btn-admin {
            width: 100%;
            height: 53px;
            border: 0;
            border-radius: 10px;
            background: #888;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #arquivoPlanilha {
            display: none;
        }

        .status {
            margin-top: 15px;
            text-align: center;
            font-size: 15px;
        }

        .atualizando {
            color: #555;
        }

        .sucesso {
            color: #16803a;
            font-weight: bold;
        }

        .erro {
            color: #d80020;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container {
                padding-top: 18px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Localizador de Peças</h1>

    <div class="subtitulo">
        Consulte onde a peça está armazenada
    </div>

    <input
        id="codigo"
        type="text"
        placeholder="Digite o código da peça"
        autocomplete="off"
    >

    <button
        class="btn-buscar"
        onclick="buscarPeca()"
    >
        BUSCAR PEÇA
    </button>

    <div id="resultado"></div>

    <div id="areaAdmin">

        <button
            id="botaoAtualizar"
            class="btn-admin"
            onclick="iniciarAtualizacao()"
        >
            ATUALIZAR BASE DE PEÇAS
        </button>

        <input
            id="arquivoPlanilha"
            type="file"
            accept=".xlsx,.xls"
        >

        <div
            id="statusAtualizacao"
            class="status"
        ></div>

    </div>

</div>


<script>

    const campoCodigo =
        document.getElementById("codigo");

    const resultado =
        document.getElementById("resultado");

    const arquivoPlanilha =
        document.getElementById("arquivoPlanilha");

    const statusAtualizacao =
        document.getElementById("statusAtualizacao");

    const botaoAtualizar =
        document.getElementById("botaoAtualizar");


    // =====================================================
    // ENTER PARA BUSCAR
    // =====================================================

    campoCodigo.addEventListener(
        "keydown",
        function(evento) {

            if (evento.key === "Enter") {
                buscarPeca();
            }
        }
    );


    // =====================================================
    // BUSCAR PEÇA NO SUPABASE ATRAVÉS DO SERVIDOR
    // =====================================================

    async function buscarPeca() {

        const codigo =
            campoCodigo.value.trim();

        resultado.innerHTML = "";

        if (!codigo) {
            return;
        }

        try {

            const resposta =
                await fetch(
                    "/api/peca?codigo=" +
                    encodeURIComponent(codigo)
                );

            const dados =
                await resposta.json();

            if (
                !resposta.ok ||
                !dados.sucesso
            ) {

                resultado.innerHTML =
                    '<div class="nao-encontrada">' +
                    'Erro ao consultar a base de peças.' +
                    '</div>';

                return;
            }


            if (
                !dados.pecas ||
                dados.pecas.length === 0
            ) {

                resultado.innerHTML =
                    '<div class="nao-encontrada">' +
                    '✕ Peça não encontrada.' +
                    '</div>';

                return;
            }


            resultado.innerHTML =
                dados.pecas
                    .map(
                        peca => `
                            <div class="resultado-card">

                                <p>
                                    <strong>Código:</strong>
                                    ${escaparHtml(peca.codigo)}
                                </p>

                                <p>
                                    <strong>Descrição:</strong>
                                    ${escaparHtml(peca.descricao)}
                                </p>

                                <p>
                                    <strong>Local:</strong>
                                    ${escaparHtml(peca.local)}
                                </p>

                            </div>
                        `
                    )
                    .join("");

        } catch (erro) {

            console.error(
                "Erro na consulta:",
                erro
            );

            resultado.innerHTML =
                '<div class="nao-encontrada">' +
                'Erro ao consultar a base de peças.' +
                '</div>';
        }
    }


    // =====================================================
    // INICIAR ATUALIZAÇÃO
    // =====================================================

    async function iniciarAtualizacao() {

        statusAtualizacao.textContent = "";
        statusAtualizacao.className = "status";

        const senha =
            prompt(
                "Digite a senha para atualizar a base:"
            );

        if (senha === null) {
            return;
        }


        try {

            const resposta =
                await fetch(
                    "/verificar-senha",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            senha: senha
                        })
                    }
                );


            if (!resposta.ok) {

                alert("Senha incorreta.");
                return;
            }


            const dados =
                await resposta.json();


            if (!dados.correta) {

                alert("Senha incorreta.");
                return;
            }


            // Guardamos a senha somente para este envio.
            arquivoPlanilha.dataset.senha =
                senha;


            arquivoPlanilha.value = "";

            arquivoPlanilha.click();


        } catch (erro) {

            console.error(
                "Erro ao verificar senha:",
                erro
            );

            alert(
                "Não foi possível verificar a senha."
            );
        }
    }


    // =====================================================
    // QUANDO USUÁRIO ESCOLHER A PLANILHA
    // =====================================================

    arquivoPlanilha.addEventListener(
        "change",
        async function() {

            const arquivo =
                arquivoPlanilha.files[0];

            if (!arquivo) {
                return;
            }


            const senha =
                arquivoPlanilha.dataset.senha;


            if (!senha) {

                alert(
                    "Sessão de atualização inválida."
                );

                return;
            }


            statusAtualizacao.textContent =
                "Atualizando base de peças...";

            statusAtualizacao.className =
                "status atualizando";


            botaoAtualizar.disabled = true;


            const formData =
                new FormData();


            formData.append(
                "senha",
                senha
            );


            formData.append(
                "planilha",
                arquivo
            );


            try {

                const resposta =
                    await fetch(
                        "/atualizar",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const mensagem =
                    await resposta.text();


                if (!resposta.ok) {

                    statusAtualizacao.textContent =
                        "Erro na atualização.";

                    statusAtualizacao.className =
                        "status erro";


                    alert(
                        "Erro: " + mensagem
                    );

                    return;
                }


                statusAtualizacao.textContent =
                    mensagem;

                statusAtualizacao.className =
                    "status sucesso";


                alert(mensagem);


            } catch (erro) {

                console.error(
                    "Erro ao atualizar:",
                    erro
                );


                statusAtualizacao.textContent =
                    "Erro na atualização.";

                statusAtualizacao.className =
                    "status erro";


                alert(
                    "Erro ao enviar a planilha."
                );


            } finally {

                botaoAtualizar.disabled =
                    false;

                arquivoPlanilha.value =
                    "";

                delete arquivoPlanilha.dataset.senha;
            }
        }
    );


    // =====================================================
    // PROTEÇÃO BÁSICA DO HTML
    // =====================================================

    function escaparHtml(valor) {

        return String(valor ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

</script>

</body>
</html>
